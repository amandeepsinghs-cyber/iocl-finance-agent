agents:
  - id: fin_diagnostics_agent
    class: app.agents.fin_diagnostics.tool
    requires_role: ["CMD", "DIR_FIN", "DIR_REF", "DIR_MKT", "E1_FIN", "E2_FIN", "E3_FIN", "E4_FIN"]
    description: Finance diagnostics agent for PBT bridge, refinery GRM variance, and CFO levers.
    triggers:
      - "(?i)\\b(diagnose|why did .* drop|bridge)\\b"
    examples:
      - "why did PAT drop in FY25"
      - "give me a variance bridge"
      - "diagnose the gross margin drop"
      - "show me a waterfall chart of costs"
      - "what caused the profit to decrease"
      - "pat drop kyu hua"
      - "fy25 me variance kya hai"
      - "bridge chart dikhao"

  - id: dcf_agent
    est_seconds: 15
    steps:
      - id: load_inputs
        label: "Loading inputs"
      - id: wacc_build
        label: "Building WACC"
      - id: forecast
        label: "Forecasting CF"
      - id: valuation
        label: "Computing valuation"
      - id: sensitivity_grid
        label: "Sensitivity"
      - id: tornado
        label: "Tornado"
      - id: xlsx
        label: "Generating XLSX"
      - id: publish
        label: "Publishing"
    class: app.agents.dcf_agent.DCFAgent
    requires_role: ["CMD", "DIR_FIN", "DIR_REF", "DIR_MKT", "E1_FIN", "E2_FIN", "E3_FIN", "E4_FIN"]
    description: Runs a discounted cash flow valuation for IndianOil (NSE:IOC).
    triggers:
      - "(?i)\\b(dcf|discounted cash flow|intrinsic val\\w*|under ?valued|over ?valued)\\b"
    examples:
      - "Can you run a discounted cash flow and tell if IOCL is undervalued?"
      - "dcf run karo"
      - "valuation kya hai"
      - "is iocl overvalued"
      - "show me intrinsic value"
      - "calculate dcf for fy26"
      - "run intrinsic valuation"
      - "what is the wacc"

  - id: doc_export_agent
    class: app.agents.doc_export.tool
    requires_role: ["CMD", "DIR_FIN", "DIR_REF", "DIR_MKT", "E1_FIN", "E2_FIN", "E3_FIN", "E4_FIN"]
    description: Exports Finance & Downstream tables and memos to Excel, PDF, Word, Google Docs/Sheets.
    run_mode: auto
    steps:
      - id: start
        label: "Starting export"
      - id: format
        label: "Formatting file"
      - id: done
        label: "Done"
    triggers:
      - "(?i)\\b(export|download|pdf|xlsx|excel|csv)\\b"
    examples:
      - "export this to excel"
      - "download as pdf"
      - "can you export this data"
      - "save this to a spreadsheet"
      - "download the report"
      - "is table ko excel me export karo"
      - "pdf me download karo"
      - "mujhe iska export chahiye"

  - id: analyst
    class: app.agents.analyst.AnalystAgent
    requires_role: ["CMD", "DIR_FIN", "DIR_REF", "DIR_MKT", "E1_FIN", "E2_FIN", "E3_FIN", "E4_FIN"]
    description: Core analytical planner for IndianOil Finance, Refinery Economics, Pipelines, Marketing, and MoU queries.
    triggers:
      - "(?i)\\b(balance sheet|profit|loss|revenue|excise|grm|refinery|pipeline|marketing|wacc)\\b"
    examples:
      - "show balance sheet for FY26"
      - "compare gross vs net revenue FY17-FY26"
      - "compare GRM across IndianOil refineries"
      - "what is the marketing volume for MS and HSD"
      - "give me the cash flow"
      - "grm kitna hai"
      - "balance sheet dikhao"
      - "profit kitna hua"
