# Canonical Yukti IOCL Semantic Definitions
version: 1
anchor_date: "{anchor_date}"

definitions:
  IOCL_NET_REVENUE_V1:
    definition_id: IOCL_NET_REVENUE_V1
    title: "IOCL Gross vs Net Revenue from Operations (Ind AS 115 / Note 28)"
    as_of: "{anchor_date}"
    rule_sentence: "Net Revenue = Gross Revenue from Operations minus Central Excise Duty remitted as principal refiner"
    citations:
      - doc_id: "IOCL-ACCT"
        kind: "policy"
        title: "IOCL Annual Report Note 1 & Note 28 — Ind AS 115 Central Excise Presentation"
        section: "Note 28"
        illustrative: false
    reference_sql: |
      SELECT
        fiscal_year,
        gross_revenue_inr_cr,
        excise_duty_inr_cr,
        net_revenue_inr_cr,
        ROUND(100.0 * ebitda_inr_cr / NULLIF(net_revenue_inr_cr, 0), 2) AS ebitda_margin_net_pct
      FROM `hrfin_gold.ssot_corporate_annual_360`
      ORDER BY fiscal_year DESC

  IOCL_CORE_VS_REPORTED_GRM_V1:
    definition_id: IOCL_CORE_VS_REPORTED_GRM_V1
    title: "Reported Gross Refining Margin vs Core GRM (ex-Inventory Valuation)"
    as_of: "{anchor_date}"
    rule_sentence: "Core GRM excludes FIFO/NRV crude and product inventory holding gains or losses from Reported GRM ($/bbl)"
    citations:
      - doc_id: "IOCL-ACCT"
        kind: "policy"
        title: "IOCL Annual Report Note 11 — Lower of FIFO Cost or NRV Inventory Valuation"
        section: "Note 11"
        illustrative: false
    reference_sql: |
      SELECT
        fiscal_year,
        gross_refining_margin_usd_bbl,
        core_grm_usd_bbl,
        singapore_benchmark_grm_usd_bbl,
        grm_premium_over_singapore_usd_bbl
      FROM `hrfin_gold.ssot_corporate_annual_360`
      ORDER BY fiscal_year DESC

  IOCL_REFINERY_RECONCILIATION_V1:
    definition_id: IOCL_REFINERY_RECONCILIATION_V1
    title: "Downstream 360 Reconciliation: 9 Standalone Refineries + Divisions == Corporate Standalone P&L"
    as_of: "{anchor_date}"
    rule_sentence: "SUM across 9 refineries (70.25 MMTPA) equals corporate throughput; adding Marketing, Pipelines & Corporate divisions equals Standalone P&L with 0.00 Cr error"
    citations:
      - doc_id: "IOCL-ACCT"
        kind: "policy"
        title: "IOCL Annual Report Ind AS 108 & `hrfin_gold.v_refinery_pnl_v3`"
        section: "Ind AS 108"
        illustrative: false
    reference_sql: |
      SELECT
        fiscal_year,
        refinery_id,
        refinery_name,
        throughput_mmt,
        grm_usd_bbl,
        ebitda_inr_cr,
        pbt_inr_cr
      FROM `hrfin_gold.v_refinery_pnl_v3`
      WHERE is_refinery = TRUE
      ORDER BY fiscal_year DESC, grm_usd_bbl DESC
