# SPEC-06 §4.6 / BEH-01.60–.64 / P2H.2: Refusal & Masking UX Copy (EN + HI) — Yukti IOCL
# Pattern: acknowledge -> one-line reason (no jargon, no rule IDs in headline) -> allowed alternative (auto-answer or chip).
# Rule ID goes in the "Why?" disclosure (`rule_ref`). Never "Access denied". Same language as the question.

version: 1
codes:
  R-NAMED:
    code: R-NAMED
    trigger: "junior asks for named counterparty sub-ledger or individual record"
    rule_ref: "D-11"
    auto_answer: true
    en: "I can't share counterparty-named sub-ledgers or individual officer records at your access level. Here is the anonymised aggregate summary instead."
    hi: "आपके एक्सेस स्तर पर व्यक्तिगत नाम या प्रतिपक्ष नाम साझा नहीं किए जा सकते। इसके बजाय अनाम समग्र सारांश दिखा रही हूँ।"
    alternative:
      label: "Refinery 360 aggregates"
      label_hi: "रिफाइनरी 360 आँकड़े"
      question: "Show FY26 refinery throughput and GRM by refinery"
      question_hi: "FY26 के लिए रिफाइनरी-वार थ्रूपुट और GRM दिखाएँ"
    alternatives:
      - label: "Export summary to Excel"
        label_hi: "एक्सेल में निर्यात करें"
        question: "Export refinery summary to Excel"
        question_hi: "रिफाइनरी सारांश एक्सेल में निर्यात करें"

  R-PAY:
    code: R-PAY
    trigger: "junior asks another officer's pay"
    rule_ref: "D-11"
    auto_answer: false
    en: "Individual pay is confidential. I can show company-wide employee benefit expense trends from Schedule III or aggregate grade benchmarks."
    hi: "किसी व्यक्ति का वेतन गोपनीय है। मैं शेड्यूल III से कंपनी-स्तरीय कर्मचारी लाभ व्यय या ग्रेड बेंचमार्क दिखा सकती हूँ।"
    alternative:
      label: "Schedule III employee cost"
      label_hi: "कर्मचारी लाभ व्यय"
      question: "Show 10-year employee benefit expense trend"
      question_hi: "10-वर्षीय कर्मचारी लाभ व्यय प्रवृत्ति दिखाएँ"
    alternatives:
      - label: "My role overview"
        label_hi: "मेरी भूमिका विवरण"
        question: "What can you do?"
        question_hi: "आप क्या कर सकती हैं?"

  R-APAR:
    code: R-APAR
    trigger: "junior asks APAR of others"
    rule_ref: "D-11"
    auto_answer: false
    en: "Appraisal ratings are confidential and restricted to Chairman and Functional Directors. I can show the MoU scorecard targets instead."
    hi: "मूल्यांकन रेटिंग गोपनीय हैं और केवल चेयरमैन तथा कार्यात्मक निदेशकों के लिए सुलभ हैं। मैं MoU स्कोरकार्ड लक्ष्य दिखा सकती हूँ।"
    alternative:
      label: "MoU Scorecard FY26"
      label_hi: "MoU स्कोरकार्ड FY26"
      question: "How is IndianOil tracking on MoPNG MoU targets?"
      question_hi: "IndianOil MoPNG MoU लक्ष्यों पर कैसा प्रदर्शन कर रहा है?"
    alternatives:
      - label: "MoU Scorecard FY26"
        label_hi: "MoU स्कोरकार्ड FY26"
        question: "How is IndianOil tracking on MoPNG MoU targets?"
        question_hi: "IndianOil MoPNG MoU लक्ष्यों पर कैसा प्रदर्शन कर रहा है?"

  R-SENS:
    code: R-SENS
    trigger: "vigilance/POSH/medical"
    rule_ref: "D-11"
    auto_answer: false
    en: "Sensitive case and vigilance records are restricted to Chairman and Functional Directors. I can explain published governance policies and reporting processes."
    hi: "संवेदनशील और सतर्कता मामलों के रिकॉर्ड केवल चेयरमैन और कार्यात्मक निदेशक देख सकते हैं। मैं नीति और शिकायत प्रक्रिया बता सकती हूँ।"
    alternative:
      label: "Delegation of Authority policy"
      label_hi: "अधिकार प्रत्यायोजन नीति"
      question: "Summarise IndianOil Finance and DoA governance policy"
      question_hi: "IndianOil की वित्त और अधिकार प्रत्यायोजन नीति का सारांश दें"
    alternatives:
      - label: "Delegation of Authority policy"
        label_hi: "अधिकार प्रत्यायोजन नीति"
        question: "Summarise IndianOil Finance and DoA governance policy"
        question_hi: "IndianOil की वित्त और अधिकार प्रत्यायोजन नीति का सारांश दें"

  R-FUNC:
    code: R-FUNC
    trigger: "confidential counterparty credit sub-ledgers / restricted finance packs for Grade A-D"
    rule_ref: "D-43"
    auto_answer: false
    en: "Confidential counterparty credit sub-ledgers and restricted finance packs require Director (Finance) or Chairman approval. You can view published Schedule III statements, refinery aggregates, WACC, and DCF valuation."
    hi: "गोपनीय प्रतिपक्ष क्रेडिट उप-खातों के लिए निदेशक (वित्त) या चेयरमैन का अनुमोदन आवश्यक है। आप प्रकाशित वित्तीय विवरण, रिफाइनरी आँकड़े, WACC और DCF देख सकते हैं।"
    alternative:
      label: "FY26 Income Statement"
      label_hi: "FY26 आय विवरण"
      question: "Show the income statement for FY26"
      question_hi: "FY26 का आय विवरण दिखाएँ"
    alternatives:
      - label: "Company-level totals"
        label_hi: "कंपनी-स्तर के कुल आँकड़े"
        question: "Show 10-year gross vs net revenue and PAT trend"
        question_hi: "10-वर्षीय राजस्व और PAT प्रवृत्ति दिखाएँ"

  R-BOARD:
    code: R-BOARD
    trigger: "board_confidential / board_draft_pack"
    rule_ref: "D-43"
    auto_answer: false
    en: "That Board draft pack is restricted to Chairman and Functional Directors. I can summarise the published Annual Report position or you can request access from Director (Finance)."
    hi: "वह बोर्ड ड्राफ्ट पैक चेयरमैन और कार्यात्मक निदेशकों के लिए प्रतिबंधित है। मैं प्रकाशित वार्षिक रिपोर्ट की स्थिति बता सकती हूँ।"
    alternative:
      label: "AR summary"
      label_hi: "वार्षिक रिपोर्ट सारांश"
      question: "Summarise the published Annual Report position for FY26"
      question_hi: "FY26 की प्रकाशित वार्षिक रिपोर्ट की स्थिति का सारांश दें"
    alternatives:
      - label: "AR summary"
        label_hi: "वार्षिक रिपोर्ट सारांश"
        question: "Summarise the published Annual Report position for FY26"
        question_hi: "FY26 की प्रकाशित वार्षिक रिपोर्ट की स्थिति का सारांश दें"

  R-ROLE:
    code: R-ROLE
    trigger: "non-admin role switch"
    rule_ref: "SPEC-06 §4.4 R-ROLE"
    auto_answer: false
    en: "I can't change your access level from a conversation. You're signed in as {display_name}, {designation}."
    hi: "बातचीत से आपका एक्सेस स्तर नहीं बदला जा सकता। आप {display_name}, {designation} के रूप में साइन-इन हैं।"
    alternative:
      label: "What can I ask?"
      label_hi: "मैं क्या पूछ सकता हूँ?"
      question: "What can I ask?"
      question_hi: "मैं क्या पूछ सकता हूँ?"
    alternatives:
      - label: "What can I ask?"
        label_hi: "मैं क्या पूछ सकता हूँ?"
        question: "What can I ask?"
        question_hi: "मैं क्या पूछ सकता हूँ?"

  R-K5:
    code: R-K5
    trigger: "every cell < 5 after AGG"
    rule_ref: "D-11"
    auto_answer: false
    en: "This slice has fewer than 5 records and is suppressed for privacy. Try a wider aggregate, e.g. across all 9 IndianOil refineries."
    hi: "इस समूह में 5 से कम प्रविष्टियाँ हैं। कृपया सभी 9 IndianOil रिफाइनरियों का समग्र दृश्य देखें।"
    alternative:
      label: "All 9 IOCL Refineries"
      label_hi: "सभी 9 IOCL रिफाइनरियां"
      question: "Compare FY26 throughput and GRM across all IndianOil refineries"
      question_hi: "सभी IndianOil रिफाइनरियों का FY26 थ्रूपुट और GRM तुलना करें"
    alternatives:
      - label: "All 9 IOCL Refineries"
        label_hi: "सभी 9 IOCL रिफाइनरियां"
        question: "Compare FY26 throughput and GRM across all IndianOil refineries"
        question_hi: "सभी IndianOil रिफाइनरियों का FY26 थ्रूपुट और GRM तुलना करें"

  E-AUTH:
    code: E-AUTH
    trigger: "backend auth/data outage (BUG-33)"
    rule_ref: "BUG-33"
    auto_answer: false
    en: "I can't reach the data service right now. Nothing is wrong with your question; please try again in a minute."
    hi: "अभी डेटा सेवा से संपर्क नहीं हो पा रहा। कृपया एक मिनट बाद फिर पूछें।"
    alternative: null
    alternatives: []
