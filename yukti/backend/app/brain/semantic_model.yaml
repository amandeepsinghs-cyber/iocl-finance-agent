# Yukti IOCL Semantic Model (100% Finance & Downstream OMC Scope — zero HR)
version: 1
anchor_date: "2026-10-19"

subjects:
  corporate:
    domain: finance
    table: hrfin_gold.ssot_corporate_annual_360
    description: "IOCL Standalone & Consolidated Schedule III 3-Statement financials (Gross/Excise/Net Revenue, Crude Consumed, EBITDA, PAT, Balance Sheet, Cash Flow, Macros & IOC.NS), one row per FY (FY17–FY26)."
    period: fiscal_year
    default_fy: FY26
    fields:
      fy: {column: fiscal_year, kind: fy}
    metrics:
      corporate_revenue_cr: {expr: "ROUND(SUM(gross_revenue_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Gross revenue from operations (₹ cr)", polarity: higher}
      petroleum_products_revenue_cr: {expr: "ROUND(SUM(petroleum_products_revenue_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Petroleum products revenue (₹ cr)", polarity: higher}
      petchem_and_other_op_rev_cr: {expr: "ROUND(SUM(petchem_and_other_op_rev_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Petrochemicals, pipelines & other operating revenue (₹ cr)", polarity: higher}
      other_income_cr: {expr: "ROUND(SUM(other_income_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Other income (₹ cr)", polarity: higher}
      total_income_cr: {expr: "ROUND(SUM(total_income_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total income (₹ cr)", polarity: higher}
      excise_duty_cr: {expr: "ROUND(SUM(excise_duty_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Central excise duty (₹ cr)", polarity: lower}
      net_revenue_cr: {expr: "ROUND(SUM(net_revenue_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Net revenue from operations ex-excise (₹ cr)", polarity: higher}
      cost_of_materials_consumed_cr: {expr: "ROUND(SUM(cost_of_materials_consumed_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Crude & materials consumed (₹ cr)", polarity: lower}
      purchases_stock_in_trade_cr: {expr: "ROUND(SUM(purchases_stock_in_trade_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Purchases of stock-in-trade (₹ cr)", polarity: lower}
      inventory_change_cr: {expr: "ROUND(SUM(inventory_change_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Inventory changes (₹ cr)"}
      employee_benefit_net_pnl_cr: {expr: "ROUND(SUM(employee_benefit_net_pnl_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Employee benefits expense (₹ cr)", polarity: lower}
      other_expenses_cr: {expr: "ROUND(SUM(other_expenses_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Other operating expenses (₹ cr)", polarity: lower}
      operating_expenses_cr: {expr: "ROUND(SUM(operating_expenses_total_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total operating expenses (₹ cr)", polarity: lower}
      ebitda_corporate_cr: {expr: "ROUND(SUM(ebitda_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Standalone EBITDA (₹ cr)", polarity: higher}
      ebitda_margin_corporate_pct: {expr: "ROUND(AVG(ebitda_margin_pct), 2)", aggregation: avg, unit: pct, label: "EBITDA margin on Net Revenue (%)", polarity: higher}
      dda_cr: {expr: "ROUND(SUM(dda_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Depreciation & amortisation — DD&A (₹ cr)", polarity: lower}
      finance_costs_cr: {expr: "ROUND(SUM(finance_costs_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Finance costs (₹ cr)", polarity: lower}
      exceptional_items_cr: {expr: "ROUND(SUM(exceptional_items_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Exceptional items (₹ cr)"}
      pbt_corporate_cr: {expr: "ROUND(SUM(pbt_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Profit before tax — PBT (₹ cr)", polarity: higher}
      tax_expense_cr: {expr: "ROUND(SUM(tax_expense_total_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total tax expense (₹ cr)", polarity: lower}
      current_tax_cr: {expr: "ROUND(SUM(current_tax_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Current tax (₹ cr)", polarity: lower}
      deferred_tax_cr: {expr: "ROUND(SUM(deferred_tax_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Deferred tax (₹ cr)", polarity: lower}
      pat_cr: {expr: "ROUND(SUM(pat_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Standalone PAT (₹ cr)", polarity: higher}
      pat_margin_corporate_pct: {expr: "ROUND(AVG(pat_margin_pct), 2)", aggregation: avg, unit: pct, label: "Standalone PAT margin on Net Revenue (%)", polarity: higher}
      consolidated_revenue_cr: {expr: "ROUND(SUM(consolidated_revenue_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Consolidated group revenue IOC.NS (₹ cr)", polarity: higher}
      consolidated_ebitda_cr: {expr: "ROUND(SUM(consolidated_ebitda_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Consolidated group EBITDA IOC.NS (₹ cr)", polarity: higher}
      consolidated_pbt_cr: {expr: "ROUND(SUM(consolidated_pbt_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Consolidated group PBT IOC.NS (₹ cr)", polarity: higher}
      consolidated_pat_cr: {expr: "ROUND(SUM(consolidated_pat_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Consolidated group PAT IOC.NS (₹ cr)", polarity: higher}
      total_assets_cr: {expr: "ROUND(SUM(total_assets_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total assets (₹ cr)", polarity: higher}
      non_current_assets_cr: {expr: "ROUND(SUM(non_current_assets_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total non-current assets (₹ cr)", polarity: higher}
      investments_subsidiaries_jv_cr: {expr: "ROUND(SUM(investments_subsidiaries_jv_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Investments in subsidiaries & JVs (₹ cr)", polarity: higher}
      current_assets_cr: {expr: "ROUND(SUM(current_assets_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total current assets (₹ cr)", polarity: higher}
      inventories_cr: {expr: "ROUND(SUM(inventories_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Inventories (₹ cr)"}
      trade_receivables_cr: {expr: "ROUND(SUM(receivables_outstanding_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Trade receivables (₹ cr)", polarity: lower}
      cash_and_bank_cr: {expr: "ROUND(SUM(cash_and_bank_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Cash & bank balances (₹ cr)", polarity: higher}
      equity_share_capital_cr: {expr: "ROUND(SUM(equity_share_capital_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Equity share capital (₹ cr)"}
      other_equity_reserves_cr: {expr: "ROUND(SUM(other_equity_reserves_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Other equity reserves (₹ cr)", polarity: higher}
      net_worth_cr: {expr: "ROUND(SUM(net_worth_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Standalone net worth / equity (₹ cr)", polarity: higher}
      consolidated_net_worth_cr: {expr: "ROUND(SUM(consolidated_net_worth_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Consolidated net worth (₹ cr)", polarity: higher}
      non_current_liabilities_cr: {expr: "ROUND(SUM(non_current_liabilities_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total non-current liabilities (₹ cr)", polarity: lower}
      long_term_debt_cr: {expr: "ROUND(SUM(long_term_debt_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Long-term borrowings (₹ cr)", polarity: lower}
      short_term_debt_cr: {expr: "ROUND(SUM(short_term_debt_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Short-term borrowings (₹ cr)", polarity: lower}
      total_debt_cr: {expr: "ROUND(SUM(total_debt_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total borrowings (₹ cr)", polarity: lower}
      net_debt_cr: {expr: "ROUND(SUM(net_debt_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Net debt (₹ cr)", polarity: lower}
      lease_liabilities_cr: {expr: "ROUND(SUM(lease_liabilities_non_current_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Non-current lease liabilities Ind AS 116 (₹ cr)", polarity: lower}
      deferred_tax_liability_net_cr: {expr: "ROUND(SUM(deferred_tax_liability_net_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Deferred tax liabilities net (₹ cr)", polarity: lower}
      current_liabilities_cr: {expr: "ROUND(SUM(current_liabilities_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total current liabilities (₹ cr)", polarity: lower}
      trade_payables_cr: {expr: "ROUND(SUM(trade_payables_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Trade payables (₹ cr)"}
      total_liabilities_cr: {expr: "ROUND(SUM(total_liabilities_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total liabilities (₹ cr)", polarity: lower}
      net_working_capital_cr: {expr: "ROUND(SUM(net_working_capital_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Net working capital (₹ cr)"}
      capital_employed_cr: {expr: "ROUND(SUM(capital_employed_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Capital employed (₹ cr)", polarity: higher}
      operating_cash_flow_cr: {expr: "ROUND(SUM(operating_cash_flow_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Operating cash flow — OCF (₹ cr)", polarity: higher}
      investing_cash_flow_cr: {expr: "ROUND(SUM(investing_cash_flow_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Investing cash flow (₹ cr)"}
      financing_cash_flow_cr: {expr: "ROUND(SUM(financing_cash_flow_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Financing cash flow (₹ cr)"}
      net_cash_change_cr: {expr: "ROUND(SUM(net_cash_change_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Net change in cash & equivalents (₹ cr)"}
      free_cash_flow_cr: {expr: "ROUND(SUM(free_cash_flow_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Free cash flow — FCF (₹ cr)", polarity: higher}
      dividend_payout_cr: {expr: "ROUND(SUM(total_dividend_payout_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Total dividend payout (₹ cr)"}
      csr_spend_cr: {expr: "ROUND(SUM(csr_disbursed_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "CSR spend (₹ cr)"}
      exchequer_contribution_cr: {expr: "ROUND(SUM(exchequer_contribution_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Contribution to Exchequer (₹ cr)"}
      brent_avg_usd_bbl: {expr: "ROUND(AVG(brent_avg_usd_bbl), 2)", aggregation: avg, unit: usd_per_bbl, label: "Brent crude average ($/bbl)"}
      fx_inr_per_usd: {expr: "ROUND(AVG(fx_inr_per_usd), 2)", aggregation: avg, unit: ratio, label: "USD/INR exchange rate"}
      singapore_benchmark_grm_usd_bbl: {expr: "ROUND(AVG(singapore_benchmark_grm_usd_bbl), 2)", aggregation: avg, unit: usd_per_bbl, label: "Singapore Complex GRM ($/bbl)"}
      gross_refining_margin_usd_bbl: {expr: "ROUND(AVG(gross_refining_margin_usd_bbl), 2)", aggregation: avg, unit: usd_per_bbl, label: "Corporate Reported GRM ($/bbl)", polarity: higher}
      core_grm_usd_bbl: {expr: "ROUND(AVG(core_grm_usd_bbl), 2)", aggregation: avg, unit: usd_per_bbl, label: "Corporate Core GRM ex-inventory ($/bbl)", polarity: higher}
      grm_premium_over_singapore_usd_bbl: {expr: "ROUND(AVG(grm_premium_over_singapore_usd_bbl), 2)", aggregation: avg, unit: usd_per_bbl, label: "IOCL GRM premium vs Singapore ($/bbl)", polarity: higher}
      corporate_refining_throughput_mmt: {expr: "ROUND(SUM(refining_throughput_mmt), 3)", aggregation: sum, unit: mmt, label: "Corporate crude throughput (MMT)", polarity: higher}
      corporate_refining_utilization_pct: {expr: "ROUND(AVG(refining_capacity_utilization_pct), 1)", aggregation: avg, unit: pct, label: "Corporate refining utilization (%)", polarity: higher}
      corporate_distillate_yield_pct: {expr: "ROUND(AVG(distillate_yield_pct), 2)", aggregation: avg, unit: pct, label: "Corporate distillate yield (%)", polarity: higher}
      corporate_fuel_and_loss_pct: {expr: "ROUND(AVG(fuel_and_loss_pct), 2)", aggregation: avg, unit: pct, label: "Corporate fuel & loss (%)", polarity: lower}
      corporate_pipeline_throughput_mmt: {expr: "ROUND(SUM(pipeline_throughput_mmt), 3)", aggregation: sum, unit: mmt, label: "Corporate pipeline throughput (MMT)", polarity: higher}
      corporate_marketing_sales_mmt: {expr: "ROUND(SUM(marketing_sales_mmt), 3)", aggregation: sum, unit: mmt, label: "Corporate marketing sales volume (MMT)", polarity: higher}

  refinery_economics:
    domain: finance
    table: hrfin_gold.ssot_refinery_economics_360
    base_filter: "is_refinery = TRUE"
    description: "Refinery-level economics, GRM ($/bbl), throughput (MMT), utilization %, distillate yield %, fuel & loss %, and EBITDA across IOCL's 9 standalone refineries (FY17–FY26)."
    period: fiscal_year
    default_fy: FY26
    fields:
      fy: {column: fiscal_year, kind: fy}
      refinery: {column: refinery_id, kind: "entity:refinery", label: refinery}
      refinery_name: {column: refinery_name, kind: categorical}
      state: {column: state, kind: categorical}
      region: {column: region, kind: categorical}
    metrics:
      refinery_capacity_mmtpa: {expr: "ROUND(SUM(installed_capacity_mmtpa), 2)", aggregation: sum, unit: mmtpa, label: "Installed refining capacity (MMTPA)", polarity: higher}
      refinery_throughput_mmt: {expr: "ROUND(SUM(throughput_mmt), 3)", aggregation: sum, unit: mmt, label: "Refinery crude throughput (MMT)", polarity: higher}
      refinery_utilization_pct: {expr: "ROUND(100.0 * SUM(throughput_mmt) / NULLIF(SUM(installed_capacity_mmtpa), 0), 1)", aggregation: ratio, unit: pct, label: "Capacity utilization (%)", polarity: higher}
      refinery_grm_usd_bbl: {expr: "ROUND(SUM(grm_usd_bbl * throughput_mmt) / NULLIF(SUM(throughput_mmt), 0), 2)", aggregation: ratio, unit: usd_per_bbl, label: "Refinery GRM ($/bbl)", polarity: higher}
      refinery_opex_usd_bbl: {expr: "ROUND(SUM(opex_usd_bbl * throughput_mmt) / NULLIF(SUM(throughput_mmt), 0), 2)", aggregation: ratio, unit: usd_per_bbl, label: "Refinery unit opex ($/bbl)", polarity: lower}
      refinery_distillate_yield_pct: {expr: "ROUND(SUM(distillate_yield_pct * throughput_mmt) / NULLIF(SUM(throughput_mmt), 0), 2)", aggregation: ratio, unit: pct, label: "Distillate yield (%)", polarity: higher}
      refinery_fuel_loss_pct: {expr: "ROUND(SUM(fuel_and_loss_pct * throughput_mmt) / NULLIF(SUM(throughput_mmt), 0), 2)", aggregation: ratio, unit: pct, label: "Fuel & loss (%)", polarity: lower}
      refinery_gross_revenue_cr: {expr: "ROUND(SUM(gross_revenue_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Refinery gross revenue (₹ cr)", polarity: higher}
      refinery_excise_cr: {expr: "ROUND(SUM(excise_duty_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Refinery excise duty (₹ cr)", polarity: lower}
      refinery_net_revenue_cr: {expr: "ROUND(SUM(net_revenue_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Refinery net revenue (₹ cr)", polarity: higher}
      refinery_ebitda_cr: {expr: "ROUND(SUM(ebitda_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Refinery EBITDA (₹ cr)", polarity: higher}
      refinery_pbt_cr: {expr: "ROUND(SUM(pbt_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Refinery PBT (₹ cr)", polarity: higher}
    companions: [refinery_throughput_mmt, refinery_grm_usd_bbl, refinery_ebitda_cr]

  marketing_sales:
    domain: finance
    table: hrfin_gold.fact_marketing_sales
    description: "Product-wise marketing sales volumes (MMT), India market share %, revenue (₹ cr), and gross marketing margin (₹/KL) across 7 product categories (FY17–FY26)."
    period: fiscal_year
    default_fy: FY26
    fields:
      fy: {column: fiscal_year, kind: fy}
      product: {column: product_code, kind: "entity:product", label: product}
      product_group: {column: product_group, kind: categorical}
    metrics:
      marketing_volume_mmt: {expr: "ROUND(SUM(sales_volume_mmt), 3)", aggregation: sum, unit: mmt, label: "Product sales volume (MMT)", polarity: higher}
      marketing_revenue_cr: {expr: "ROUND(SUM(revenue_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Product sales revenue (₹ cr)", polarity: higher}
      marketing_market_share_pct: {expr: "ROUND(AVG(market_share_india_pct), 1)", aggregation: avg, unit: pct, label: "India market share (%)", polarity: higher}
      marketing_margin_inr_kl: {expr: "ROUND(SUM(gross_marketing_margin_inr_kl * sales_volume_mmt) / NULLIF(SUM(sales_volume_mmt), 0), 1)", aggregation: ratio, unit: inr_kl, label: "Gross marketing margin (₹/KL)", polarity: higher}
    companions: [marketing_volume_mmt, marketing_revenue_cr, marketing_market_share_pct]

  pipeline_ops:
    domain: finance
    table: hrfin_gold.fact_pipeline_ops
    description: "Cross-country Crude Oil, Product, and Natural Gas pipeline lengths (km), throughput (MMT), utilization %, tariff revenue & EBITDA (FY17–FY26)."
    period: fiscal_year
    default_fy: FY26
    fields:
      fy: {column: fiscal_year, kind: fy}
      pipeline: {column: pipeline_code, kind: "entity:pipeline", label: pipeline}
    metrics:
      pipeline_length_km: {expr: "ROUND(SUM(pipeline_length_km), 0)", aggregation: sum, unit: km, label: "Pipeline network length (km)", polarity: higher}
      pipeline_capacity_mmtpa: {expr: "ROUND(SUM(installed_capacity_mmtpa), 2)", aggregation: sum, unit: mmtpa, label: "Pipeline capacity (MMTPA)", polarity: higher}
      pipeline_throughput_mmt: {expr: "ROUND(SUM(throughput_mmt), 3)", aggregation: sum, unit: mmt, label: "Pipeline throughput (MMT)", polarity: higher}
      pipeline_utilization_pct: {expr: "ROUND(100.0 * SUM(throughput_mmt) / NULLIF(SUM(installed_capacity_mmtpa), 0), 1)", aggregation: ratio, unit: pct, label: "Pipeline utilization (%)", polarity: higher}
      pipeline_tariff_revenue_cr: {expr: "ROUND(SUM(tariff_revenue_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Pipeline tariff revenue (₹ cr)", polarity: higher}
      pipeline_ebitda_cr: {expr: "ROUND(SUM(ebitda_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Pipeline EBITDA (₹ cr)", polarity: higher}
      pipeline_unit_cost_inr_mt: {expr: "ROUND(SUM(unit_operating_cost_inr_mt * throughput_mmt) / NULLIF(SUM(throughput_mmt), 0), 1)", aggregation: ratio, unit: inr_mt, label: "Pipeline unit operating cost (₹/MT)", polarity: lower}
    companions: [pipeline_throughput_mmt, pipeline_ebitda_cr, pipeline_utilization_pct]

  segment_finance:
    domain: finance
    table: hrfin_gold.fact_segment
    base_filter: "scope = 'standalone'"
    description: "Ind AS 108 Statutory Segment Revenue, EBIT Result, Assets, and Capital Employed across Petroleum Products, Petrochemicals & Pipelines/Other (FY17–FY26)."
    period: fiscal_year
    default_fy: FY26
    fields:
      fy: {column: fiscal_year, kind: fy}
      segment: {column: segment_code, kind: categorical, label: segment}
    metrics:
      segment_revenue_cr: {expr: "ROUND(SUM(CASE WHEN metric = 'segment_revenue' THEN value_inr_cr ELSE 0 END), 2)", aggregation: sum, unit: inr_cr, label: "Segment revenue (₹ cr)", polarity: higher}
      segment_ebit_cr: {expr: "ROUND(SUM(CASE WHEN metric = 'segment_result_ebit' THEN value_inr_cr ELSE 0 END), 2)", aggregation: sum, unit: inr_cr, label: "Segment EBIT result (₹ cr)", polarity: higher}
      segment_assets_cr: {expr: "ROUND(SUM(CASE WHEN metric = 'segment_assets' THEN value_inr_cr ELSE 0 END), 2)", aggregation: sum, unit: inr_cr, label: "Segment assets (₹ cr)", polarity: higher}
      segment_capital_employed_cr: {expr: "ROUND(SUM(CASE WHEN metric = 'segment_capital_employed' THEN value_inr_cr ELSE 0 END), 2)", aggregation: sum, unit: inr_cr, label: "Segment capital employed (₹ cr)", polarity: higher}
    companions: [segment_revenue_cr, segment_ebit_cr, segment_capital_employed_cr]

  subsidiary_finance:
    domain: finance
    table: hrfin_silver.subsidiary_financials
    description: "IOCL Group Subsidiaries & JVs (CPCL, Lanka IOC, IOCME, IndOil Global, HURL/Petronet JVs, Consolidation Adj.) reconciling Standalone PAT to Consolidated IOC.NS PAT (FY17–FY26)."
    period: fiscal_year
    default_fy: FY26
    fields:
      fy: {column: fiscal_year, kind: fy}
      subsidiary: {column: entity_code, kind: "entity:subsidiary", label: subsidiary}
    metrics:
      subsidiary_revenue_cr: {expr: "ROUND(SUM(revenue_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Subsidiary revenue (₹ cr)", polarity: higher}
      subsidiary_ebitda_cr: {expr: "ROUND(SUM(ebitda_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Subsidiary EBITDA (₹ cr)", polarity: higher}
      subsidiary_pat_cr: {expr: "ROUND(SUM(pat_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Subsidiary PAT (₹ cr)", polarity: higher}
      iocl_share_pat_cr: {expr: "ROUND(SUM(iocl_share_pat_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "IOCL share of PAT (₹ cr)", polarity: higher}
      subsidiary_dividend_cr: {expr: "ROUND(SUM(dividend_received_by_iocl_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Dividend received by IOCL (₹ cr)", polarity: higher}
      subsidiary_roce_pct: {expr: "ROUND(AVG(roce_pct), 1)", aggregation: avg, unit: pct, label: "Subsidiary ROCE (%)", polarity: higher}
    companions: [subsidiary_pat_cr, iocl_share_pat_cr, subsidiary_revenue_cr]

  mou:
    domain: finance
    table: hrfin_gold.fact_mou_scorecard
    description: "IOCL DPE / MoPNG Maharatna MoU Scorecard parameters, targets, actual achievement, and composite score (FY25–FY26)."
    period: fiscal_year
    default_fy: FY26
    row_only: true
    fields:
      fy: {column: fiscal_year, kind: fy}
      category: {column: category, kind: categorical}
    metrics:
      mou_scorecard: {expr: "COUNT(*)", aggregation: count, unit: parameters, label: "MoU scorecard"}
    row_columns:
      - {expr: parameter_id, as: parameter_id}
      - {expr: parameter_name, as: parameter}
      - {expr: category, as: category}
      - {expr: unit_of_measure, as: unit}
      - {expr: weightage, as: weightage}
      - {expr: very_good_target, as: very_good_target}
      - {expr: excellent_target, as: excellent_target}
      - {expr: actual_achievement, as: achievement}
      - {expr: achieved_rating, as: rating}
      - {expr: projected_composite_score, as: projected_composite_score}
    row_sort: {by: weightage, dir: desc}

  capex:
    domain: finance
    table: hrfin_gold.ssot_corporate_annual_360
    description: "Annual IOCL Capital Expenditure, CWIP, Net PPE & Capex Cash Outflow (FY17–FY26)."
    period: fiscal_year
    default_fy: FY26
    fields:
      fy: {column: fiscal_year, kind: fy}
    metrics:
      capex_actual_cr: {expr: "ROUND(SUM(total_capex_spent_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Capital expenditure spent (₹ cr)"}
      cwip_cr: {expr: "ROUND(SUM(cwip_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Capital work-in-progress — CWIP (₹ cr)"}
      refinery_petchem_ppe_cr: {expr: "ROUND(SUM(refinery_petchem_ppe_inr_cr), 2)", aggregation: sum, unit: inr_cr, label: "Net PPE & ROU assets (₹ cr)", polarity: higher}

  ratios:
    domain: finance
    table: hrfin_gold.ssot_corporate_annual_360
    description: "IOCL Financial Ratios, Return Metrics, Liquidity, Leverage & Per-Share Indicators (FY17–FY26)."
    period: fiscal_year
    default_fy: FY26
    fields:
      fy: {column: fiscal_year, kind: fy}
    metrics:
      roce_pct: {expr: "ROUND(AVG(standalone_roce_pct), 2)", aggregation: avg, unit: pct, label: "Standalone ROCE (%)", polarity: higher}
      consolidated_roce_pct: {expr: "ROUND(AVG(roce_pct), 2)", aggregation: avg, unit: pct, label: "Consolidated ROCE (%)", polarity: higher}
      roe_pct: {expr: "ROUND(AVG(roe_pct), 2)", aggregation: avg, unit: pct, label: "Return on equity — ROE (%)", polarity: higher}
      roa_pct: {expr: "ROUND(AVG(roa_pct), 2)", aggregation: avg, unit: pct, label: "Return on assets — ROA (%)", polarity: higher}
      debt_to_equity_ratio: {expr: "ROUND(AVG(debt_to_equity_ratio), 2)", aggregation: avg, unit: ratio, label: "Debt-to-equity ratio (x)", polarity: lower}
      net_debt_to_ebitda_ratio: {expr: "ROUND(AVG(net_debt_to_ebitda_ratio), 2)", aggregation: avg, unit: ratio, label: "Net debt-to-EBITDA ratio (x)", polarity: lower}
      interest_coverage_ratio: {expr: "ROUND(AVG(interest_coverage_ratio), 2)", aggregation: avg, unit: ratio, label: "Interest coverage ratio (x)", polarity: higher}
      current_ratio: {expr: "ROUND(AVG(current_ratio), 2)", aggregation: avg, unit: ratio, label: "Current ratio (x)", polarity: higher}
      receivable_days: {expr: "ROUND(AVG(receivable_days), 1)", aggregation: avg, unit: days, label: "Trade receivable days — DSO", polarity: lower}
      inventory_days: {expr: "ROUND(AVG(inventory_days), 1)", aggregation: avg, unit: days, label: "Inventory holding days — DIO", polarity: lower}
      eps_basic_inr: {expr: "ROUND(AVG(eps_basic_inr), 2)", aggregation: avg, unit: ratio, label: "Basic EPS (₹/share)", polarity: higher}
      book_value_per_share_inr: {expr: "ROUND(AVG(book_value_per_share_inr), 2)", aggregation: avg, unit: ratio, label: "Book value per share (₹/share)", polarity: higher}
      dividend_per_share_inr: {expr: "ROUND(AVG(dividend_per_share_inr), 2)", aggregation: avg, unit: ratio, label: "Dividend per share (₹/share)", polarity: higher}
      dividend_yield_pct: {expr: "ROUND(AVG(dividend_yield_pct), 2)", aggregation: avg, unit: pct, label: "Dividend yield (%)", polarity: higher}
      ocf_to_ebitda_pct: {expr: "ROUND(AVG(ocf_to_ebitda_pct), 1)", aggregation: avg, unit: pct, label: "OCF / EBITDA cash conversion (%)", polarity: higher}

  retail_fuel_prices:
    domain: finance
    table: hrfin_gold.fact_retail_fuel_prices
    description: "10-year IOCL metro retail fuel selling prices (MS Petrol ₹/L, HSD Diesel ₹/L, Indane LPG ₹/14.2kg, ATF ₹/kL) across Delhi, Mumbai, Kolkata, Chennai (FY17–FY27)."
    period: fiscal_year
    default_fy: FY26
    fields:
      fy: {column: fiscal_year, kind: fy}
      city: {column: city, kind: categorical, label: city}
      fuel: {column: fuel_code, kind: categorical, label: fuel}
    metrics:
      retail_fuel_rsp: {expr: "ROUND(AVG(rsp_value), 2)", aggregation: avg, unit: inr_per_l, label: "Retail selling price (RSP)"}
      retail_fuel_price_change: {expr: "ROUND(SUM(rsp_change_inr), 2)", aggregation: sum, unit: inr_per_l, label: "Net price change (₹)"}
    companions: [retail_fuel_rsp, retail_fuel_price_change]

  fuel_price_buildup:
    domain: finance
    table: hrfin_gold.fact_fuel_price_buildup
    description: "Delhi retail petrol and diesel price build-up breaking down Base Price, Freight, Central Excise Duty, Dealer Commission, State VAT, and total tax share (FY17–FY27)."
    period: fiscal_year
    default_fy: FY26
    fields:
      fy: {column: fiscal_year, kind: fy}
      city: {column: city, kind: categorical, label: city}
      fuel: {column: fuel_code, kind: categorical, label: fuel}
    metrics:
      buildup_rsp_inr_l: {expr: "ROUND(AVG(rsp_inr_l), 2)", aggregation: avg, unit: inr_per_l, label: "Delhi pump price RSP (₹/L)"}
      buildup_base_price_inr_l: {expr: "ROUND(AVG(base_price_inr_l), 2)", aggregation: avg, unit: inr_per_l, label: "Base refinery transfer price (₹/L)"}
      buildup_excise_inr_l: {expr: "ROUND(AVG(excise_duty_inr_l), 2)", aggregation: avg, unit: inr_per_l, label: "Central excise duty (₹/L)"}
      buildup_vat_inr_l: {expr: "ROUND(AVG(vat_inr_l), 2)", aggregation: avg, unit: inr_per_l, label: "State VAT (₹/L)"}
      buildup_tax_share_pct: {expr: "ROUND(AVG(total_tax_pct), 2)", aggregation: avg, unit: pct, label: "Total tax share of RSP (%)"}
    companions: [buildup_rsp_inr_l, buildup_excise_inr_l, buildup_vat_inr_l, buildup_tax_share_pct]

templates:
  pnl_statement:
    domain: finance
    label: "IOCL Schedule III Statement of Profit & Loss"
    description: "Complete Ind-AS Schedule III Statement of Profit & Loss including Gross Revenue, Central Excise Duty, Net Revenue, Crude Consumed, Purchases, Inventory Change, EBITDA, DD&A, Finance Costs, Exceptional Items, PBT, Tax, Standalone PAT & Consolidated IOC.NS PAT (FY17–FY26)."
    period: fiscal_year
    default_from: FY17
    default_to: FY26
  balance_sheet:
    domain: finance
    label: "IOCL Schedule III Balance Sheet"
    description: "Complete Ind-AS Schedule III Balance Sheet including Net PPE, CWIP, Subsidiary/JV Investments (CPCL, HURL, Petronet LNG), Inventories, Trade Receivables, Cash & Bank, Net Worth, Borrowings, Ind-AS 116 Lease Liabilities & Indane LPG Security Deposits (FY17–FY26)."
    period: fiscal_year
    default_from: FY17
    default_to: FY26
  cash_flow_statement:
    domain: finance
    label: "IOCL Ind-AS 7 Statement of Cash Flows"
    description: "Complete Ind-AS 7 Statement of Cash Flows (PBT, Working Capital Changes, Taxes Paid, OCF, Capex Outflow, Investing Cash Flow, Net Borrowings, Lease & Dividend Payments, Financing Cash Flow & Closing Cash) (FY17–FY26)."
    period: fiscal_year
    default_from: FY17
    default_to: FY26
  financial_ratios:
    domain: finance
    label: "IOCL Financial Ratios & Credit Scorecard"
    description: "Corporate Financial Ratios Scorecard (EBITDA Margin, PAT Margin, ROCE, ROE, Debt-to-Equity, Current Ratio, DSO, DIO, EPS, BVPS, DPS & GRM benchmarks) (FY17–FY26)."
    period: fiscal_year
    default_from: FY17
    default_to: FY26
  working_capital:
    domain: finance
    label: "IOCL Working Capital, Inventory Days & Receivable Days"
    description: "10-year working capital cycle tracking Inventories, Trade Receivables, Trade Payables, Net Working Capital, Inventory Days (DIO), Receivable Days (DSO), and Current Ratio (FY17–FY26)."
    period: fiscal_year
    default_from: FY17
    default_to: FY26
  wacc_pct:
    domain: finance
    label: "IOCL Weighted Average Cost of Capital (WACC %)"
    description: "Historical WACC (%) series (FY17–FY26 or FY22–FY26), including Cost of Equity (Ke) and Post-Tax Cost of Debt (Kd*(1-t)), modelled from RBI/FBIL G-Sec, Damodaran ERP, and NSE:IOC equity beta."
    period: range
    default_from: FY22
    default_to: FY26
  wacc_components:
    domain: finance
    label: "IOCL WACC Build-up and Component Breakdown"
    description: "Stacked components of WACC across years: Risk-free rate (Rf), Equity Risk Premium (Beta * ERP), and Post-tax Cost of Debt weighted by capital structure."
    period: range
    default_from: FY22
    default_to: FY26
  wacc_build_up:
    domain: finance
    label: "IOCL WACC Single-Year Parameter Build-Up"
    description: "Single-year WACC parameter table and KPI: Rf, beta, ERP, CRP, Kd pretax, tax rate, equity/debt weights, Ke, Kd post-tax, and WACC with lineage."
    period: fiscal_year
    default_from: FY26
    default_to: FY26
  wacc_change_attribution:
    domain: finance
    label: "IOCL WACC Change Attribution (Shapley)"
    description: "Exact 5-Factor Shapley attribution (Rf, ERP, Beta, Kd after tax, Capital weights) explaining YoY changes in IOCL WACC."
    period: fiscal_year
    default_from: FY25
    default_to: FY26
