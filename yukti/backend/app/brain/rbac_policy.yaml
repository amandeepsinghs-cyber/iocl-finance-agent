# Single Source of Truth for Yukti IOCL RBAC (P2H.1 / SPEC-06 / BEH-01 / D-41 / D-43 / D-60).
# Every enforcement point (planner, compiler, contract post-processor, narrator,
# document tools, and UI chips) derives its decision from this file via `app/brain/rbac.py`.

version: 2
unknown_persona: reject
small_cell_threshold: 5
aggregate_dimension_default: grade

# D-43: Function-scoped Director access toggle. In Yukti IOCL Finance-only mode,
# Chairman and Functional Directors (DIR_FIN, DIR_REF, DIR_MKT) hold full access
# across statutory statements, downstream aggregates, WACC/DCF, and confidential
# Finance/Board packs, whereas Officer Grades A–D (E1_FIN..E4_FIN) see published
# statements, aggregates, WACC, and DCF while confidential packs/sub-ledgers require approval.
director_function_scope: true

rule_refs:
  D-10: "D-10: Chairman and Functional Directors see full statutory, downstream 360, and confidential Finance/Board packs"
  D-11: "D-11: IOCL Officer Grades A–D see public statutory statements, downstream aggregates, WACC, and DCF; confidential sub-ledgers, Board draft packs, and named individual records require Director (Finance) or Chairman approval"
  D-41: "D-41: 8 canonical IOCL Finance & Downstream personas (CMD, DIR_FIN, DIR_REF, DIR_MKT, E1_FIN..E4_FIN) + DEMO_ADMIN"
  D-43: "D-43: IOCL Finance & DoA governance tiering (Leadership vs Grades A–D) with Request Access routing to DIR_FIN / CMD"

functions:
  EXEC: [FIN, CORP, OPS, MKT]
  FIN: [FIN, CORP, OPS, MKT]
  OPS: [FIN, CORP, OPS]
  MKT: [FIN, CORP, MKT]

persona_classes:
  leadership: [CMD]
  director: [DIR_FIN, DIR_REF, DIR_MKT]
  junior: [E1_FIN, E2_FIN, E3_FIN, E4_FIN]

# Legacy 5-class summary matrix preserved for backward compatibility with B3 tests.
matrix:
