# Result columns that carry a data class (post-query masking on any path).
column_classes:
  named: [emp_id, emp_name, name, employee_name, incumbent_emp_id, successor_1_emp_id, successor_2_emp_id,
          reporting_officer_emp_id, reviewing_officer_emp_id]
  pay: [gross_salary_inr, net_salary_inr, basic_pay_inr, da_inr, hra_inr, fy26_gross_salary_inr,
        fy26_gross_salary_lakh, avg_monthly_gross_inr, prp_inr, fy26_prp_inr, overtime_amount_inr,
        avg_gross_salary_lakh, cafeteria_allowances_inr, net_pay_inr, pay_band]
  apar: [fy26_apar_score, fy26_apar_rating, numerical_score, final_rating, avg_apar_score, apar_score]
  sensitive: [vigilance_status, posh_case_id, diagnosis, medical_condition]
  fin_internal: [vendor_id, vendor_name, invoice_no, invoice_id, cost_center_owner, cost_centre_owner, po_number, gl_account_id]
  fin_confidential: [counterparty_id, counterparty_name, credit_limit_inr_cr, credit_exposure_inr_cr, subledger_account]

column_patterns:
  named: ["^emp_?name$", "^employee_?name$", "^name$", "^emp_?id$", "_emp_id$", "^officer_?name$"]
  pay: ["salary", "_pay$", "^pay_", "gross_pay", "basic_pay", "net_pay", "pay_band", "ctc", "^prp", "_prp", "allowance", "wage", "remuneration", "emolument", "bonus", "increment"]
  apar: ["apar", "appraisal", "performance_rating", "performance_score"]
  sensitive: ["vigilance", "posh", "medical", "diagnosis", "disciplinary"]
  fin_internal: ["^vendor_?name$", "^vendor_?id$", "^invoice_?(?:no|id)$", "^po_?number$", "cost_cent(?:re|er)_owner"]
  fin_confidential: ["^counterparty_?(?:id|name)$", "credit_exposure", "credit_limit", "subledger"]

topic_keywords:
  pay: [salary, salaries, pay of, pay band, net pay, basic pay, gross pay, average pay, take-home pay, take home pay, compensation, ctc, wages,
        wage, remuneration, emoluments, prp, performance related pay, bonus, increment, allowance of, perks, वेतन, तनख्वाह, सैलरी, tankhwah]
  apar: [apar, apars, appraisal rating, appraisal score, performance rating, performance score, कार्य प्रदर्शन, वार्षिक निष्पादन, वार्षिक प्रदर्शन, मूल्यांकन, रेटिंग]
  sensitive: [vigilance, posh, sexual harassment, medical history, medical record, medical records, medical claim, medical claims, health record,
              health records, disciplinary, सतर्कता, चिकित्सा, स्वास्थ्य]
  fin_confidential: [counterparty credit, credit sub-ledger, credit subledger, vendor sub-ledger, vendor subledger,
                     customer credit exposure, credit default watchlist, confidential pricing memo, unhedged forex exposure]
  board_draft_pack: [board draft pack, draft board pack, draft board note, board agenda pack, draft audit committee]

row_actions: []

refusal_templates:
  pay_individual:
    code: R-PAY
    en: "Individual salary, CTC, and payroll breakdowns of other officers are restricted to Chairman and Functional Directors. Under your current role ({persona_label}), I can share published grade-level benchmarks or statutory Schedule III employee benefit aggregates."
    hi: "अन्य अधिकारियों का व्यक्तिगत वेतन और पेरोल विवरण केवल चेयरमैन और कार्यात्मक निदेशकों के लिए उपलब्ध है। आपकी वर्तमान भूमिका ({persona_label}) के तहत मैं प्रकाशित शेड्यूल III कर्मचारी लाभ के समग्र आँकड़े साझा कर सकती हूँ।"
  pay:
    code: R-PAY
    en: "Individual salary, CTC, and payroll breakdowns of other officers are restricted to Chairman and Functional Directors. Under your current role ({persona_label}), I can share published grade-level benchmarks or statutory Schedule III employee benefit aggregates."
    hi: "अन्य अधिकारियों का व्यक्तिगत वेतन और पेरोल विवरण केवल चेयरमैन और कार्यात्मक निदेशकों के लिए उपलब्ध है। आपकी वर्तमान भूमिका ({persona_label}) के तहत मैं प्रकाशित शेड्यूल III कर्मचारी लाभ के समग्र आँकड़े साझा कर सकती हूँ।"
  apar:
    code: R-APAR
    en: "Individual APAR performance scores and appraisal dossiers are confidential and accessible only to Chairman and Functional Directors. Under {persona_label}, this individual record cannot be disclosed."
    hi: "व्यक्तिगत APAR प्रदर्शन स्कोर और मूल्यांकन डोजियर गोपनीय हैं और केवल चेयरमैन तथा कार्यात्मक निदेशकों के लिए सुलभ हैं।"
  sensitive:
    code: R-SENS
    en: "Vigilance, POSH, disciplinary, and medical case records contain sensitive personal data and are restricted to Chairman and Functional Directors. Under {persona_label}, I cannot disclose individual case details."
    hi: "सतर्कता, POSH, अनुशासनात्मक और चिकित्सा मामलों के रिकॉर्ड संवेदनशील व्यक्तिगत डेटा हैं और केवल चेयरमैन तथा निदेशकों के लिए प्रतिबंधित हैं।"
  named:
    code: R-NAMED
    en: "Counterparty-named sub-ledgers and individual officer records are restricted to Chairman and Functional Directors. Under {persona_label}, I have provided the anonymised aggregate summary."
    hi: "नामित प्रतिपक्ष उप-खाते और व्यक्तिगत रिकॉर्ड केवल चेयरमैन और निदेशकों के लिए उपलब्ध हैं। {persona_label} के अंतर्गत अनाम समग्र सारांश नीचे दिया गया है।"
  function_mismatch:
    code: R-FUNC
    en: "Confidential Finance packs, counterparty credit sub-ledgers, and vendor-level ageing records are restricted to Chairman and Functional Directors under IOCL governance policy (D-43). Under {persona_label}, you can access published Schedule III statements, refinery/marketing aggregates, WACC, DCF valuation, or request Director (Finance) approval."
    hi: "गोपनीय वित्त पैक और प्रतिपक्ष क्रेडिट उप-खाते IOCL की नीति (D-43) के तहत चेयरमैन और निदेशकों के लिए प्रतिबंधित हैं। {persona_label} के अंतर्गत आप प्रकाशित वित्तीय विवरण, रिफाइनरी/मार्केटिंग आँकड़े, WACC और DCF मूल्यांकन देख सकते हैं या निदेशक (वित्त) से अनुमोदन का अनुरोध कर सकते हैं।"
  board_confidential:
    code: R-BOARD
    en: "Confidential Board draft packs and deliberation memoranda are restricted to Chairman and Functional Directors. Under {persona_label}, please submit an Access Request to Director (Finance) / Chairman or view published Annual Report disclosures."
    hi: "बोर्ड ड्राफ्ट पैक और गोपनीय नोट्स केवल चेयरमैन और कार्यात्मक निदेशकों के लिए प्रतिबंधित हैं। {persona_label} के अंतर्गत कृपया निदेशक (वित्त) / चेयरमैन से अनुमोदन का अनुरोध करें।"
  role_escalation:
    code: R-ROLE
    en: "Persona cannot be changed from inside a question. Your active session remains {persona_label}. To switch personas in a demo, please use the top-right Persona selector (or sign in as Demo Admin)."
    hi: "प्रश्न के भीतर से भूमिका (परसोना) नहीं बदली जा सकती। आपका सक्रिय सत्र {persona_label} बना हुआ है। भूमिका बदलने के लिए कृपया शीर्ष-दाईं ओर परसोना चयनकर्ता का उपयोग करें।"
  small_cell:
    code: R-K5
    en: "This cohort has fewer than 5 records (k < 5). To prevent indirect identification, small-cell values under 5 are suppressed."
    hi: "इस समूह में 5 से कम प्रविष्टियाँ हैं (k < 5)। अप्रत्यक्ष पहचान रोकने के लिए 5 से छोटे समूहों के आंकड़े प्रदर्शित नहीं किए जाते।"
  default:
    code: R-NAMED
    en: "This data is restricted under your current role ({persona_label}). Please request access from Director (Finance) / Chairman or ask for published aggregates."
    hi: "यह डेटा आपकी वर्तमान भूमिका ({persona_label}) के अंतर्गत प्रतिबंधित है। कृपया निदेशक (वित्त) / चेयरमैन से अनुमोदन का अनुरोध करें।"
