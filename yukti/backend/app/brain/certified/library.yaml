queries:
- id: Q01
  group: 'Pillar 1: Schedule III P&L & Gross-vs-Net Excise'
  canonical_question: Show the Schedule III Profit and Loss statement of IOCL for FY26
  intent_keywords:
  - schedule iii
  - profit and loss
  - p&l
  - fy26
  - excise duty
  - pat
  - ebitda
  - net revenue
  intent_description: 'IOCL FY26 standalone Schedule III P&L: Gross Revenue ₹8,86,224.41 Cr, Excise Duty
    ₹1,02,066.54 Cr, Net Revenue ₹7,84,157.87 Cr, EBITDA ₹74,243.42 Cr, PBT ₹49,153.42 Cr, PAT ₹36,802.42
    Cr.'
  parameterized_sql: "SELECT\n    line_order,\n    line_code,\n    line_name,\n    section,\n    schedule_ref,\n\
    \    ROUND(amount_inr_cr, 2) AS amount_inr_cr,\n    ROUND(prior_fy_amount_inr_cr, 2) AS prior_fy_amount_inr_cr,\n\
    \    ROUND(yoy_delta_inr_cr, 2) AS yoy_delta_inr_cr,\n    ROUND(yoy_change_pct, 2) AS yoy_change_pct\n\
    FROM `yukti-finance-iocl.hrfin_gold.ssot_corporate_pnl_lines`\nWHERE fiscal_year = @fiscal_year\n\
    ORDER BY line_order ASC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year FY17-FY26
  visual_kind: table
  provenance:
    source_file: financial_build/iocl_certified/Q01.sql
    sha256: 65da47af44415826dcf91c56be25511ae7142c4b8b07fc8d05ca7b289d834444
    gold_objects: hrfin_gold.ssot_corporate_pnl_lines
- id: Q02
  group: 'Pillar 1: Schedule III P&L & Gross-vs-Net Excise'
  canonical_question: Show IOCL's 10-year Revenue Net of Excise, EBITDA, and PAT trend from FY17 to FY26
  intent_keywords:
  - 10-year
  - revenue net of excise
  - ebitda
  - pat
  - trend
  - fy17
  - fy26
  - standalone
  - consolidated
  intent_description: IOCL 10-year (FY17-FY26) P&L trajectory showing Net Revenue, EBITDA, PBT, Standalone
    PAT (peak ₹39,618.84 Cr in FY24, ₹36,802.42 Cr in FY26), and Consolidated PAT.
  parameterized_sql: "SELECT\n    fiscal_year,\n    ROUND(gross_revenue_inr_cr, 2) AS gross_revenue_inr_cr,\n\
    \    ROUND(excise_duty_inr_cr, 2) AS excise_duty_inr_cr,\n    ROUND(net_revenue_inr_cr, 2) AS net_revenue_inr_cr,\n\
    \    ROUND(ebitda_inr_cr, 2) AS ebitda_inr_cr,\n    ROUND(pbt_inr_cr, 2) AS pbt_inr_cr,\n    ROUND(pat_inr_cr,\
    \ 2) AS pat_inr_cr,\n    ROUND(consolidated_pat_inr_cr, 2) AS consolidated_pat_inr_cr,\n    ROUND(ebitda_margin_pct,\
    \ 2) AS ebitda_margin_pct\nFROM `yukti-finance-iocl.hrfin_gold.ssot_corporate_annual_360`\nWHERE fiscal_year\
    \ BETWEEN @from_fy AND @to_fy\nORDER BY fiscal_year ASC;"
  params:
    from_fy:
      type: STRING
      default: FY17
      description: Start fiscal year
    to_fy:
      type: STRING
      default: FY26
      description: End fiscal year
  visual_kind: bar_chart
  provenance:
    source_file: financial_build/iocl_certified/Q02.sql
    sha256: 131e93393a083fe020159ccf8ddde344e06d0f9c4778c423d15bb1e1d7a6752f
    gold_objects: hrfin_gold.ssot_corporate_annual_360
- id: Q03
  group: 'Pillar 1: Schedule III P&L & Gross-vs-Net Excise'
  canonical_question: Compare IOCL Gross Revenue including Excise Duty vs Net Revenue from Operations
    across FY17 to FY26
  intent_keywords:
  - gross revenue
  - net revenue
  - excise duty
  - exchequer
  - ind as 115
  - bridge
  intent_description: Ind AS 115 Gross-vs-Net Revenue bridge showing Central Excise Duty deductions (₹1,02,066.54
    Cr in FY26, 11.5% of gross turnover) and total exchequer contribution.
  parameterized_sql: "SELECT\n    fiscal_year,\n    ROUND(gross_revenue_inr_cr, 2) AS gross_revenue_inr_cr,\n\
    \    ROUND(excise_duty_inr_cr, 2) AS excise_duty_inr_cr,\n    ROUND(net_revenue_inr_cr, 2) AS net_revenue_inr_cr,\n\
    \    ROUND(SAFE_DIVIDE(excise_duty_inr_cr * 100.0, NULLIF(gross_revenue_inr_cr, 0)), 2) AS excise_pct_of_gross,\n\
    \    ROUND(exchequer_contribution_inr_cr, 2) AS exchequer_contribution_inr_cr\nFROM `yukti-finance-iocl.hrfin_gold.ssot_corporate_annual_360`\n\
    WHERE fiscal_year BETWEEN @from_fy AND @to_fy\nORDER BY fiscal_year ASC;"
  params:
    from_fy:
      type: STRING
      default: FY17
      description: Start fiscal year
    to_fy:
      type: STRING
      default: FY26
      description: End fiscal year
  visual_kind: bar_chart
  provenance:
    source_file: financial_build/iocl_certified/Q03.sql
    sha256: 1bfe3abb14e4520aaf70275807b9a57e41289829dd64f267245ef8520d557794
    gold_objects: hrfin_gold.ssot_corporate_annual_360
- id: Q04
  group: 'Pillar 1: Schedule III P&L & Gross-vs-Net Excise'
  canonical_question: Break down IOCL's Cost of Materials Consumed and Inventory Valuation Gain/Loss from
    FY20 to FY26
  intent_keywords:
  - cost of materials
  - crude consumed
  - inventory change
  - inventory gain
  - core grm
  - reported grm
  intent_description: Crude raw material intake, traded product purchases, inventory valuation change,
    and Reported vs Core GRM spread from FY20 to FY26.
  parameterized_sql: "SELECT\n    fiscal_year,\n    ROUND(brent_avg_usd_bbl, 2) AS brent_avg_usd_bbl,\n\
    \    ROUND(cost_of_materials_consumed_inr_cr, 2) AS cost_of_materials_consumed_inr_cr,\n    ROUND(purchases_stock_in_trade_inr_cr,\
    \ 2) AS purchases_stock_in_trade_inr_cr,\n    ROUND(inventory_change_inr_cr, 2) AS inventory_change_inr_cr,\n\
    \    ROUND(gross_refining_margin_usd_bbl, 2) AS reported_grm_usd_bbl,\n    ROUND(core_grm_usd_bbl,\
    \ 2) AS core_grm_usd_bbl,\n    ROUND(gross_refining_margin_usd_bbl - core_grm_usd_bbl, 2) AS inventory_grm_impact_usd_bbl\n\
    FROM `yukti-finance-iocl.hrfin_gold.ssot_corporate_annual_360`\nWHERE fiscal_year BETWEEN @from_fy\
    \ AND @to_fy\nORDER BY fiscal_year ASC;"
  params:
    from_fy:
      type: STRING
      default: FY20
      description: Start fiscal year
    to_fy:
      type: STRING
      default: FY26
      description: End fiscal year
  visual_kind: table
  provenance:
    source_file: financial_build/iocl_certified/Q04.sql
    sha256: 340e1aba31718b052a1583be8206179c46cf8e9a20459c969b6b9d5ce35570fc
    gold_objects: hrfin_gold.ssot_corporate_annual_360
- id: Q05
  group: 'Pillar 1: Schedule III P&L & Gross-vs-Net Excise'
  canonical_question: How did MS/HSD retail price freezes and domestic LPG under-recoveries impact IOCL's
    P&L in FY23 vs FY25-FY26?
  intent_keywords:
  - retail price freeze
  - ms
  - hsd
  - lpg
  - under-recovery
  - lpg buffer
  - marketing margin
  - fy23
  intent_description: P&L vs Marketing division gross margins for MS, HSD, and LPG showing the FY23 marketing
    margin squeeze and FY24-FY26 normalization.
  parameterized_sql: "WITH mkt AS (\n    SELECT\n        fiscal_year,\n        MAX(IF(product_code = 'MS',\
    \ ROUND(gross_marketing_margin_inr_kl, 0), NULL)) AS ms_margin_inr_kl,\n        MAX(IF(product_code\
    \ = 'HSD', ROUND(gross_marketing_margin_inr_kl, 0), NULL)) AS hsd_margin_inr_kl,\n        MAX(IF(product_code\
    \ = 'LPG', ROUND(gross_marketing_margin_inr_kl, 0), NULL)) AS lpg_margin_inr_kl,\n        ROUND(SUM(sales_volume_mmt),\
    \ 2) AS total_mkt_sales_mmt\n    FROM `yukti-finance-iocl.hrfin_gold.fact_marketing_sales`\n    WHERE\
    \ fiscal_year BETWEEN @from_fy AND @to_fy\n    GROUP BY fiscal_year\n)\nSELECT\n    c.fiscal_year,\n\
    \    ROUND(c.brent_avg_usd_bbl, 2) AS brent_avg_usd_bbl,\n    m.total_mkt_sales_mmt,\n    m.ms_margin_inr_kl,\n\
    \    m.hsd_margin_inr_kl,\n    m.lpg_margin_inr_kl,\n    ROUND(c.ebitda_inr_cr, 2) AS standalone_ebitda_cr,\n\
    \    ROUND(c.pbt_inr_cr, 2) AS standalone_pbt_cr,\n    ROUND(c.pat_inr_cr, 2) AS standalone_pat_cr\n\
    FROM `yukti-finance-iocl.hrfin_gold.ssot_corporate_annual_360` c\nJOIN mkt m ON c.fiscal_year = m.fiscal_year\n\
    ORDER BY c.fiscal_year ASC;"
  params:
    from_fy:
      type: STRING
      default: FY22
      description: Start fiscal year
    to_fy:
      type: STRING
      default: FY26
      description: End fiscal year
  visual_kind: table
  provenance:
    source_file: financial_build/iocl_certified/Q05.sql
    sha256: 422c4a399a67c7460fc03be27f386e0e69c87253c80e692821ed8136b356bfae
    gold_objects: hrfin_gold.fact_marketing_sales, hrfin_gold.ssot_corporate_annual_360
- id: Q06
  group: 'Pillar 1: Schedule III P&L & Gross-vs-Net Excise'
  canonical_question: Reconcile IOCL Standalone PAT to Consolidated Group PAT (IOC.NS on Yahoo Finance)
    for FY24, FY25, and FY26
  intent_keywords:
  - reconcile
  - standalone pat
  - consolidated pat
  - cpcl
  - lanka ioc
  - subsidiaries
  - jv
  - ioc.ns
  intent_description: Entity-by-entity Standalone to Consolidated PAT bridge across CPCL, Lanka IOC, IOC
    Middle East, IndOil Global, Petronet/HURL JVs, and Eliminations.
  parameterized_sql: "SELECT\n    s.fiscal_year,\n    s.entity_code,\n    s.entity_name,\n    ROUND(s.iocl_equity_holding_pct,\
    \ 2) AS iocl_holding_pct,\n    ROUND(s.revenue_inr_cr, 2) AS revenue_inr_cr,\n    ROUND(s.ebitda_inr_cr,\
    \ 2) AS ebitda_inr_cr,\n    ROUND(s.pat_inr_cr, 2) AS entity_pat_inr_cr,\n    ROUND(s.iocl_share_pat_inr_cr,\
    \ 2) AS iocl_share_pat_inr_cr,\n    ROUND(c.pat_inr_cr, 2) AS standalone_pat_inr_cr,\n    ROUND(c.consolidated_pat_inr_cr,\
    \ 2) AS consolidated_pat_inr_cr\nFROM `yukti-finance-iocl.hrfin_silver.subsidiary_financials` s\n\
    JOIN `yukti-finance-iocl.hrfin_gold.ssot_corporate_annual_360` c ON s.fiscal_year = c.fiscal_year\n\
    WHERE s.fiscal_year = @fiscal_year\nORDER BY s.iocl_share_pat_inr_cr DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year FY17-FY26
  visual_kind: table
  provenance:
    source_file: financial_build/iocl_certified/Q06.sql
    sha256: 0543007ca745022e3cb8669f644a25d540086a47f6e6b8c38e6dcb15163ede1c
    gold_objects: hrfin_silver.subsidiary_financials, hrfin_gold.ssot_corporate_annual_360
- id: Q07
  group: 'Pillar 2: Refinery Economics 360, Pipelines & Marketing'
  canonical_question: Rank all IOCL refineries by Gross Refining Margin ($/bbl) and EBITDA in FY26
  intent_keywords:
  - rank
  - refineries
  - grm
  - gross refining margin
  - ebitda
  - paradip
  - panipat
  - koyali
  - digboi
  intent_description: FY26 ranking of all 9 standalone IOCL refineries (70.25 MMTPA combined) by Gross
    Refining Margin ($/bbl), EBITDA (₹ Cr), and PBT.
  parameterized_sql: "SELECT\n    refinery_id,\n    refinery_name,\n    state,\n    region,\n    ROUND(installed_capacity_mmtpa,\
    \ 2) AS capacity_mmtpa,\n    ROUND(throughput_mmt, 2) AS throughput_mmt,\n    ROUND(capacity_utilization_pct,\
    \ 1) AS utilization_pct,\n    ROUND(grm_usd_bbl, 2) AS grm_usd_bbl,\n    ROUND(opex_usd_bbl, 2) AS\
    \ opex_usd_bbl,\n    ROUND(ebitda_inr_cr, 2) AS ebitda_inr_cr,\n    ROUND(pbt_inr_cr, 2) AS pbt_inr_cr\n\
    FROM `yukti-finance-iocl.hrfin_gold.ssot_refinery_economics_360`\nWHERE fiscal_year = @fiscal_year\
    \ AND is_refinery = TRUE\nORDER BY grm_usd_bbl DESC, ebitda_inr_cr DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year FY17-FY26
  visual_kind: bar_chart
  provenance:
    source_file: financial_build/iocl_certified/Q07.sql
    sha256: 058005d622abfcf66279c4d73805def502b89b7cb5043857f1802360e3dc9184
    gold_objects: hrfin_gold.ssot_refinery_economics_360
- id: Q08
  group: 'Pillar 2: Refinery Economics 360, Pipelines & Marketing'
  canonical_question: Show crude throughput (MMT) and capacity utilization % across Panipat, Paradip,
    Koyali, Mathura, Haldia, Barauni, Bongaigaon, Guwahati, and Digboi
  intent_keywords:
  - crude throughput
  - capacity utilization
  - panipat
  - paradip
  - koyali
  - mathura
  - haldia
  - barauni
  - bongaigaon
  - guwahati
  - digboi
  intent_description: Unit-level nameplate refining capacity, crude throughput (MMT), and capacity utilization
    % across all 9 IOCL refineries.
  parameterized_sql: "SELECT\n    refinery_id,\n    refinery_name,\n    region,\n    ROUND(installed_capacity_mmtpa,\
    \ 2) AS installed_capacity_mmtpa,\n    ROUND(throughput_mmt, 3) AS throughput_mmt,\n    ROUND(capacity_utilization_pct,\
    \ 1) AS capacity_utilization_pct,\n    ROUND(net_revenue_inr_cr, 2) AS net_revenue_inr_cr\nFROM `yukti-finance-iocl.hrfin_gold.ssot_refinery_economics_360`\n\
    WHERE fiscal_year = @fiscal_year AND is_refinery = TRUE\nORDER BY throughput_mmt DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year FY17-FY26
  visual_kind: bar_chart
  provenance:
    source_file: financial_build/iocl_certified/Q08.sql
    sha256: 38633ef86a57789a33ad5cbc2ee3095aa3abe70b6b5d90dfb117d52de79a0f47
    gold_objects: hrfin_gold.ssot_refinery_economics_360
- id: Q09
  group: 'Pillar 2: Refinery Economics 360, Pipelines & Marketing'
  canonical_question: Compare distillate yield % and fuel & loss % across all 9 IOCL refineries
  intent_keywords:
  - distillate yield
  - fuel and loss
  - energy intensity
  - mbn
  - opex per bbl
  - refinery efficiency
  intent_description: High-value distillate yield %, internal Fuel & Loss %, and refining Opex ($/bbl)
    across IOCL's 9 standalone refineries.
  parameterized_sql: "SELECT\n    refinery_id,\n    refinery_name,\n    ROUND(throughput_mmt, 2) AS throughput_mmt,\n\
    \    ROUND(distillate_yield_pct, 2) AS distillate_yield_pct,\n    ROUND(fuel_and_loss_pct, 2) AS fuel_and_loss_pct,\n\
    \    ROUND(opex_usd_bbl, 2) AS opex_usd_bbl,\n    ROUND(grm_usd_bbl, 2) AS grm_usd_bbl,\n    ROUND(ebitda_inr_cr,\
    \ 2) AS ebitda_inr_cr\nFROM `yukti-finance-iocl.hrfin_gold.ssot_refinery_economics_360`\nWHERE fiscal_year\
    \ = @fiscal_year AND is_refinery = TRUE\nORDER BY distillate_yield_pct DESC, fuel_and_loss_pct ASC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year FY17-FY26
  visual_kind: table
  provenance:
    source_file: financial_build/iocl_certified/Q09.sql
    sha256: e965518f525b930a073bab3e914c7b2c3e6b2adab67a1ea3f90aacf1c257d3b6
    gold_objects: hrfin_gold.ssot_refinery_economics_360
- id: Q10
  group: 'Pillar 2: Refinery Economics 360, Pipelines & Marketing'
  canonical_question: What was IOCL's crude, product, and gas pipeline throughput (MMT) and EBITDA contribution
    from FY17 to FY26?
  intent_keywords:
  - pipeline
  - crude pipeline
  - product pipeline
  - gas pipeline
  - throughput
  - tariff revenue
  - ebitda
  intent_description: Cross-country pipeline network length (km), throughput (MMT), utilization %, tariff
    revenue, EBITDA, and unit operating cost across Crude, Product, and Gas pipelines.
  parameterized_sql: "SELECT\n    fiscal_year,\n    pipeline_code,\n    pipeline_type,\n    ROUND(pipeline_length_km,\
    \ 0) AS pipeline_length_km,\n    ROUND(installed_capacity_mmtpa, 2) AS capacity_mmtpa,\n    ROUND(throughput_mmt,\
    \ 2) AS throughput_mmt,\n    ROUND(capacity_utilization_pct, 1) AS utilization_pct,\n    ROUND(tariff_revenue_inr_cr,\
    \ 2) AS tariff_revenue_inr_cr,\n    ROUND(ebitda_inr_cr, 2) AS ebitda_inr_cr,\n    ROUND(unit_operating_cost_inr_mt,\
    \ 1) AS unit_opex_inr_mt\nFROM `yukti-finance-iocl.hrfin_gold.fact_pipeline_ops`\nWHERE fiscal_year\
    \ = @fiscal_year\nORDER BY throughput_mmt DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year FY17-FY26
  visual_kind: table
  provenance:
    source_file: financial_build/iocl_certified/Q10.sql
    sha256: 3a47e25cca3539a5fa9439110219940cb9e54fad635718fc06021dffa848bb29
    gold_objects: hrfin_gold.fact_pipeline_ops
- id: Q11
  group: 'Pillar 2: Refinery Economics 360, Pipelines & Marketing'
  canonical_question: Break down IOCL's domestic petroleum product sales volume (MMT) across MS (Petrol),
    HSD (Diesel), ATF, Indane LPG, Bitumen, and SERVO Lubes in FY26
  intent_keywords:
  - marketing sales
  - volume
  - ms
  - petrol
  - hsd
  - diesel
  - atf
  - indane lpg
  - bitumen
  - servo
  intent_description: FY26 product-wise marketing sales volume (MMT), YoY growth %, market share %, revenue,
    and gross marketing margin (₹/KL).
  parameterized_sql: "SELECT\n    product_code,\n    product_category,\n    product_group,\n    ROUND(sales_volume_mmt,\
    \ 3) AS sales_volume_mmt,\n    ROUND(prior_fy_volume_mmt, 3) AS prior_fy_volume_mmt,\n    ROUND(yoy_volume_growth_pct,\
    \ 2) AS yoy_growth_pct,\n    ROUND(market_share_india_pct, 1) AS market_share_pct,\n    ROUND(revenue_inr_cr,\
    \ 2) AS revenue_inr_cr,\n    ROUND(gross_marketing_margin_inr_kl, 0) AS gross_margin_inr_kl\nFROM\
    \ `yukti-finance-iocl.hrfin_gold.fact_marketing_sales`\nWHERE fiscal_year = @fiscal_year\nORDER BY\
    \ sales_volume_mmt DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year FY17-FY26
  visual_kind: bar_chart
  provenance:
    source_file: financial_build/iocl_certified/Q11.sql
    sha256: 736aa2066d328cccdd82440fd99cab9548e663be617f095632c6d17107139d2a
    gold_objects: hrfin_gold.fact_marketing_sales
- id: Q12
  group: 'Pillar 2: Refinery Economics 360, Pipelines & Marketing'
  canonical_question: Compare revenue, EBIT, and ROCE across IOCL's Petroleum Products, Petrochemicals,
    and Other Business segments from FY17 to FY26
  intent_keywords:
  - ind as 108
  - segments
  - petroleum products
  - petrochemicals
  - other business
  - segment ebit
  - segment assets
  intent_description: Ind AS 108 statutory segment revenue, EBIT result, segment assets, and implied ROCE
    across Petroleum Products, Petrochemicals, and Other Business.
  parameterized_sql: "SELECT\n    fiscal_year,\n    segment_code,\n    ROUND(MAX(IF(line_code = 'SEG.REV',\
    \ value_inr_cr, NULL)), 2) AS segment_revenue_inr_cr,\n    ROUND(MAX(IF(line_code = 'SEG.RES', value_inr_cr,\
    \ NULL)), 2) AS segment_ebit_inr_cr,\n    ROUND(MAX(IF(line_code = 'SEG.ASSETS', value_inr_cr, NULL)),\
    \ 2) AS segment_assets_inr_cr,\n    ROUND(SAFE_DIVIDE(\n        MAX(IF(line_code = 'SEG.RES', value_inr_cr,\
    \ NULL)) * 100.0,\n        NULLIF(MAX(IF(line_code = 'SEG.ASSETS', value_inr_cr, NULL)), 0)\n    ),\
    \ 2) AS segment_roce_proxy_pct\nFROM `yukti-finance-iocl.hrfin_gold.fact_segment`\nWHERE scope = 'standalone'\
    \ AND fiscal_year BETWEEN @from_fy AND @to_fy\nGROUP BY fiscal_year, segment_code\nORDER BY fiscal_year\
    \ DESC, segment_revenue_inr_cr DESC;"
  params:
    from_fy:
      type: STRING
      default: FY17
      description: Start fiscal year
    to_fy:
      type: STRING
      default: FY26
      description: End fiscal year
  visual_kind: table
  provenance:
    source_file: financial_build/iocl_certified/Q12.sql
    sha256: 73b12a8ac52564c636009fbb51ab8b737dcf6dcec490ac84bf1c1632e4aa9e97
    gold_objects: hrfin_gold.fact_segment
- id: Q13
  group: 'Pillar 3: Schedule III Balance Sheet, Borrowings & Capex'
  canonical_question: Show IOCL's Schedule III Balance Sheet for FY26
  intent_keywords:
  - balance sheet
  - schedule iii
  - total assets
  - net worth
  - equity
  - liabilities
  - solvency
  - fy26
  intent_description: Complete IOCL FY26 Schedule III Balance Sheet reconciling Total Assets (₹4,77,282.34
    Cr) to Total Equity and Liabilities.
  parameterized_sql: "SELECT\n    line_order,\n    line_code,\n    line_name,\n    section,\n    schedule_ref,\n\
    \    ROUND(amount_inr_cr, 2) AS amount_inr_cr,\n    ROUND(prior_fy_amount_inr_cr, 2) AS prior_fy_amount_inr_cr,\n\
    \    ROUND(yoy_delta_inr_cr, 2) AS yoy_delta_inr_cr,\n    ROUND(yoy_change_pct, 2) AS yoy_change_pct\n\
    FROM `yukti-finance-iocl.hrfin_gold.ssot_corporate_balance_sheet_lines`\nWHERE fiscal_year = @fiscal_year\n\
    ORDER BY line_order ASC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year FY17-FY26
  visual_kind: table
  provenance:
    source_file: financial_build/iocl_certified/Q13.sql
    sha256: 6fc36633c93a284b10079218f64dca532bbe71c7fdcd25000a88b6b974e11d56
    gold_objects: hrfin_gold.ssot_corporate_balance_sheet_lines
- id: Q14
  group: 'Pillar 3: Schedule III Balance Sheet, Borrowings & Capex'
  canonical_question: How did IOCL's Total Borrowings and Debt-to-Equity ratio move from FY17 to FY26?
  intent_keywords:
  - total borrowings
