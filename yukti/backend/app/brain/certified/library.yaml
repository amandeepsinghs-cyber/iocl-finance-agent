- id: Q22
  group: 'Pillar 5: Yahoo IOC.NS, Macro Sensitivity, WACC & DCF'
  canonical_question: What is the annualized impact on IOCL EBITDA and PAT if Gross Refining Margin improves
    by $1.50/bbl across ~75 MMT throughput, or if retail auto-fuel margin drops by ₹0.50/litre?
  intent_keywords:
  - grm sensitivity
  - '1.50'
  - what-if
  - retail margin
  - auto-fuel
  - refinery margin uplift
  intent_description: Refinery-level baseline GRM, throughput (MMT), EBITDA, and quantified annualized
    ₹ Cr EBITDA impact per +$1.00/bbl & +$1.50/bbl GRM uplift.
  parameterized_sql: "SELECT\n    refinery_id,\n    refinery_name,\n    ROUND(throughput_mmt, 3) AS throughput_mmt,\n\
    \    ROUND(grm_usd_bbl, 2) AS base_grm_usd_bbl,\n    ROUND(ebitda_inr_cr, 2) AS base_ebitda_inr_cr,\n\
    \    ROUND(throughput_mmt * 7.33 * 1.50 * 88.37 / 10.0, 2) AS grm_plus_1_50_ebitda_gain_cr,\n    ROUND((throughput_mmt\
    \ * 7.33 * 1.50 * 88.37 / 10.0) * (1.0 - 0.2517), 2) AS grm_plus_1_50_pat_gain_cr\nFROM `yukti-finance-iocl.hrfin_gold.ssot_refinery_economics_360`\n\
    WHERE fiscal_year = @fiscal_year AND is_refinery = TRUE\nORDER BY grm_plus_1_50_ebitda_gain_cr DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year FY17-FY26
  visual_kind: table
  provenance:
    source_file: financial_build/iocl_certified/Q22.sql
    sha256: ef5a10ca80eb39747313ed3365eee4ccf7e83b4720062c723d047e61040f285b
