- id: Q30
  group: 'Pillar 6: Finance Policy RAG, Persona RBAC & Board Deliverables'
  canonical_question: Draft a Board Note for the Chairman and Director (Finance) on FY26 Refinery GRM
    performance and FY27 Capex funding plan, and export the statement as PDF and Excel
  intent_keywords:
  - board note
  - chairman
  - director finance
  - grm performance
  - capex funding
  - export pdf excel
  intent_description: Verified FY26 Board Note data pack uniting Corporate Capex, Operating Cash Flow,
    Debt Headroom, and Top Refinery Economics.
  parameterized_sql: "SELECT\n    r.refinery_id,\n    r.refinery_name,\n    ROUND(r.throughput_mmt, 2)\
    \ AS throughput_mmt,\n    ROUND(r.capacity_utilization_pct, 1) AS utilization_pct,\n    ROUND(r.grm_usd_bbl,\
    \ 2) AS grm_usd_bbl,\n    ROUND(r.ebitda_inr_cr, 2) AS refinery_ebitda_inr_cr,\n    ROUND(c.total_capex_spent_inr_cr,\
    \ 2) AS corp_capex_inr_cr,\n    ROUND(c.operating_cash_flow_inr_cr, 2) AS corp_ocf_inr_cr,\n    ROUND(c.cwip_inr_cr,\
    \ 2) AS corp_cwip_inr_cr\nFROM `yukti-finance-iocl.hrfin_gold.ssot_refinery_economics_360` r\nJOIN\
    \ `yukti-finance-iocl.hrfin_gold.ssot_corporate_annual_360` c ON r.fiscal_year = c.fiscal_year\nWHERE\
    \ r.fiscal_year = @fiscal_year AND r.is_refinery = TRUE\nORDER BY r.ebitda_inr_cr DESC;"
  params:
    fiscal_year:
      type: STRING
      default: FY26
      description: Fiscal year FY17-FY26
  visual_kind: table
  provenance:
    source_file: financial_build/iocl_certified/Q30.sql
    sha256: 8ae17537a4256ed91dfb8482011be7b535ce305c6b1f44b98433afe6c90c8838
    gold_objects: hrfin_gold.ssot_refinery_economics_360, hrfin_gold.ssot_corporate_annual_360
