- id: Q29
  group: 'Pillar 6: Finance Policy RAG, Persona RBAC & Board Deliverables'
  canonical_question: Show confidential counterparty credit exposure by trader and unpublished Q1 Board
    draft refinery margin sub-ledgers
  intent_keywords:
  - counterparty credit
  - trader
  - unpublished
  - board draft
  - confidential
  - sub-ledger
  intent_description: 'REFUSAL for Officer Grades A-D (E1_FIN-E4_FIN): confidential counterparty credit
    sub-ledgers and unpublished Board margin packs require Director (Finance) or Chairman approval.'
  parameterized_sql: "SELECT\n    fiscal_year,\n    ROUND(net_revenue_inr_cr, 2) AS net_revenue_inr_cr,\n\
    \    ROUND(ebitda_inr_cr, 2) AS ebitda_inr_cr,\n    ROUND(gross_refining_margin_usd_bbl, 2) AS reported_grm_usd_bbl,\n\
    \    ROUND(receivables_outstanding_inr_cr, 2) AS aggregate_receivables_inr_cr\nFROM `yukti-finance-iocl.hrfin_gold.ssot_corporate_annual_360`\n\
    WHERE fiscal_year = @fiscal_year;"
