  intent_description: 'NSE:IOC valuation anchor from SSOT: 1,412.1238 Cr shares, Close ₹135.40, Net Debt
    ₹1,09,482.60 Cr, Investments ₹68,940 Cr, FCF ₹32,270 Cr, WACC 9.2534%.'
  parameterized_sql: "SELECT\n    c.fiscal_year,\n    ROUND(c.shares_outstanding_cr, 4) AS shares_outstanding_cr,\n\
    \    ROUND(c.iocl_close_price_inr, 2) AS market_price_inr,\n    ROUND(c.market_cap_inr_cr, 2) AS market_cap_inr_cr,\n\
    \    ROUND(c.ebitda_inr_cr, 2) AS ebitda_inr_cr,\n    ROUND(c.operating_cash_flow_inr_cr, 2) AS ocf_inr_cr,\n\
    \    ROUND(c.total_capex_spent_inr_cr, 2) AS capex_inr_cr,\n    ROUND(c.free_cash_flow_inr_cr, 2)\
