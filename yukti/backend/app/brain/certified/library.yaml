    Total Debt, Net Debt (₹1,09,482.60 Cr in FY26), and Debt/Equity (0.54x).
  parameterized_sql: "SELECT\n    fiscal_year,\n    ROUND(long_term_debt_inr_cr, 2) AS long_term_debt_inr_cr,\n\
    \    ROUND(short_term_debt_inr_cr, 2) AS short_term_debt_inr_cr,\n    ROUND(lease_liabilities_non_current_inr_cr,\
    \ 2) AS lease_liabilities_inr_cr,\n    ROUND(total_debt_inr_cr, 2) AS total_debt_inr_cr,\n    ROUND(cash_and_bank_inr_cr,\
    \ 2) AS cash_and_bank_inr_cr,\n    ROUND(net_debt_inr_cr, 2) AS net_debt_inr_cr,\n    ROUND(net_worth_inr_cr,\
    \ 2) AS net_worth_inr_cr,\n    ROUND(debt_to_equity_ratio, 2) AS debt_to_equity_ratio,\n    ROUND(net_debt_to_ebitda_ratio,\
    \ 2) AS net_debt_to_ebitda_ratio\nFROM `yukti-finance-iocl.hrfin_gold.ssot_corporate_annual_360`\n\
    WHERE fiscal_year BETWEEN @from_fy AND @to_fy\nORDER BY fiscal_year ASC;"
