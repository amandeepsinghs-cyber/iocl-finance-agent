    \ 2) AS lease_liabilities_inr_cr,\n    ROUND(c.investments_subsidiaries_jv_inr_cr, 2) AS investments_jv_sub_inr_cr,\n\
    \    ROUND(w.wacc_pct, 4) AS wacc_pct\nFROM `yukti-finance-iocl.hrfin_gold.ssot_corporate_annual_360`\
    \ c\nJOIN `yukti-finance-iocl.hrfin_gold.fact_wacc_annual` w ON c.fiscal_year = w.fiscal_year\nWHERE\
