# Section tagging rules for the IOCL Annual Report text chunker (FY17-FY26).
# JSON-compatible YAML (flow style, full-line comments only).
{
  "toc_min_sections": 3,
  "max_carry_pages": {"ten_year": 4, "cmd_letter": 5},
  "rules": [
    {
      "section": "mdna",
      "patterns": [
        "(\\d{1,2}\\.\\s*)?management'?s? discussion (and|&) analysis( report)?( \\(md&?a\\))?"
      ]
    },
    {
      "section": "brsr",
      "patterns": [
        "(\\d{1,2}\\.\\s*)?business responsibility( (and|&) sustainability)? report(ing)?( \\(brsr\\))?"
      ]
    },
    {
      "section": "directors_report",
      "patterns": [
        "(annexures? to (the )?)?boards?'? report",
        "(annexures? to (the )?)?board'?s'? report",
        "(annexures? to (the )?)?directors'? report"
      ]
    },
    {
      "section": "cmd_letter",
      "patterns": [
        "chairman'?s'? (message|letter)",
        "from the chairman'?s'? desk",
        "message from the chairman.*",
        "chairman'?s'? statement"
      ]
    },
    {
      "section": "ten_year",
      "patterns": [
        "((standalone|group|iocl|indianoil|\\d{1,2} years'?( group)?) )?performance at a glance",
        "financial performance (highlights|at a glance)",
        "decade of .*excellence.*"
      ]
    },
    {
      "section": "fs",
      "patterns": [
        "(standalone|consolidated) financial statements?"
      ]
    },
    {
      "section": "notes",
      "patterns": [
        "(accompanying )?notes to (the )?(standalone|consolidated)? ?financial statements?.*"
      ]
    },
    {
      "section": "notes",
      "scope": "running_title_or_fs",
      "patterns": [
        "notes"
      ]
    },
    {
      "section": "other",
      "patterns": [
        "corporate governance( report)?",
        "report on corporate governance",
        "independent auditors?'? report.*",
        "comments of (the )?c&ag.*",
        "secretarial audit report",
        "auditors'? certificate on corporate governance",
        "statement pursuant to section \\d+.*\\(aoc-1\\)"
      ]
    },
    {
      "section": "other",
      "scope": "running_title",
      "patterns": [
        "integrated report",
        "corporate overview",
        "statutory reports",
        "board of directors"
      ]
    }
  ],
  "note_regex": "^\\s*(?:NOTE\\s*[-\\u2013\\u2014]?\\s*)?(\\d{1,2})[A-Z]?\\s*[:.]\\s+[A-Z]",
  "keywords": {
    "GRM": "\\bGRM\\b|gross refining margin|refining margin",
    "EXCISE_DUTY": "\\bexcise duty\\b|\\bcentral excise\\b|statutory levies",
    "THROUGHPUT": "\\bthroughput\\b|crude processed|refinery capacity utilisation|capacity utilization",
    "INVENTORY": "\\binventor(y|ies)\\b|inventory gain|inventory loss|stock-in-trade|NRV",
    "RECEIVABLE": "\\breceivables?\\b|LPG buffer|under-?recover(y|ies)",
    "BORROWINGS": "\\bborrowings?\\b|commercial paper|debt-equity|debentures|ECB",
    "EXCHANGE_LOSS": "\\b(foreign )?exchange (loss|losses|fluctuation|difference|variation)",
    "LPG_BUFFER": "\\bLPG\\b.*(grant|subsidy|under-?recover|buffer|compensation)|One[- ]time grant",
    "PETROCHEMICALS": "\\bpetrochemicals?\\b|PX/PTA|paraxylene|polypropylene|MEG|naphtha cracker",
    "PIPELINE": "\\bpipelines?\\b|cross-country pipeline|crude oil pipeline|product pipeline",
    "CAPEX": "\\bcapex\\b|capital expenditure|CWIP|capital work-in-progress",
    "NET_ZERO": "\\bnet[- ]?zero\\b|green hydrogen|renewable|ethanol|compressed biogas|CBG|SAF",
    "IMPAIRMENT": "\\bimpairment\\b",
    "LEASE": "\\bleases?\\b|Ind AS 116|right-of-use",
    "TAX_115BAA": "\\b115BAA\\b|deferred tax|effective tax",
    "DIVIDEND": "\\bdividend\\b|bonus shares|payout ratio"
  },
  "entities": {
    "PANIPAT": "\\bPanipat\\b|Naphtha Cracker",
    "PARADIP": "\\bParadip\\b",
    "KOYALI": "\\bKoyali\\b|Gujarat Refinery",
    "MATHURA": "\\bMathura\\b",
    "HALDIA": "\\bHaldia\\b",
    "BARAUNI": "\\bBarauni\\b",
    "BONGAIGAON": "\\bBongaigaon\\b",
    "GUWAHATI": "\\bGuwahati\\b",
    "DIGBOI": "\\bDigboi\\b",
    "CPCL": "\\bCPCL\\b|Chennai Petroleum",
    "LANKA_IOC": "\\bLanka IOC\\b|\\bLIOC\\b",
    "PETRONET_LNG": "\\bPetronet LNG\\b",
    "HURL": "\\bHURL\\b|Hindustan Urvarak",
    "INDANE": "\\bIndane\\b",
    "SERVO": "\\bSERVO\\b",
    "XP95": "\\bXP95\\b|XP100|XtraGreen"
  }
}
